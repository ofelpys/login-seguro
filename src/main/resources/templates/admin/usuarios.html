<!DOCTYPE html>
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragmentos/layout :: head('Usuários')}"></head>
<body>
<header th:replace="~{fragmentos/layout :: cabecalho}"></header>
<main class="container container-amplo">
    <h1>Usuários cadastrados</h1>
    <p class="sucesso"
       th:if="${sucesso}"
       th:text="${sucesso}"></p>

    <p class="erro"
       th:if="${erro}"
       th:text="${erro}"></p>

    <div class="tabela-responsiva">
        <table>
            <thead>
            <tr>
                <th scope="col">Nome</th>
                <th scope="col">E-mail</th>
                <th scope="col">Perfil</th>
                <th scope="col">Ações</th>
            </tr>
            </thead>

            <tbody>
            <tr th:each="usuario : ${usuarios}">
                <td th:text="${usuario.nome}"></td>
                <td th:text="${usuario.email}"></td>
                <td th:text="${usuario.perfil}"></td>

                <td>
                    <div class="acoes">
                        <a th:href="@{/admin/usuarios/{id}/editar(id=${usuario.id})}">
                            Editar
                        </a>

                        <form th:action="@{/admin/usuarios/{id}/excluir(id=${usuario.id})}"
                              method="post"
                              onsubmit="return confirm('Deseja excluir este usuário? Esta ação não pode ser desfeita.');">

                            <button type="submit" class="botao-excluir">
                                Excluir
                            </button>
                        </form>
                    </div>
                </td>
            </tr>

            <tr th:if="${#lists.isEmpty(usuarios)}">
                <td colspan="4">Nenhum usuário cadastrado.</td>
            </tr>
            </tbody>
        </table>
    </div>

    <p>
        <a th:href="@{/admin}">Voltar à administração</a>
    </p>
</main>
<footer th:replace="~{fragmentos/layout :: rodape}"></footer>
</body>
</html>
