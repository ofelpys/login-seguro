<!DOCTYPE html>
<html lang="pt-br" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragmentos/layout :: head('Editar Usuário')}"></head>
<body>
<header th:replace="~{fragmentos/layout :: cabecalho}"></header>
<main class="container">
    <h1>Editar usuário</h1>

    <form th:action="@{/admin/usuarios/{id}/editar(id=${id})}"
          th:object="${usuario}"
          method="post">

        <div th:if="${#fields.hasGlobalErrors()}" class="erro">
            <p th:each="erro : ${#fields.globalErrors()}"
               th:text="${erro}"></p>
        </div>

        <div class="campo">
            <label for="nome">Nome</label>
            <input id="nome"
                   type="text"
                   th:field="*{nome}"
                   minlength="2"
                   maxlength="100"
                   required>

            <span class="erro"
                  th:if="${#fields.hasErrors('nome')}"
                  th:errors="*{nome}"></span>
        </div>

        <div class="campo">
            <label for="email">E-mail</label>
            <input id="email"
                   type="email"
                   th:field="*{email}"
                   maxlength="254"
                   required>

            <span class="erro"
                  th:if="${#fields.hasErrors('email')}"
                  th:errors="*{email}"></span>
        </div>

        <div class="campo">
            <label for="perfil">Perfil</label>
            <select id="perfil" th:field="*{perfil}" required>
                <option th:each="perfil : ${perfis}"
                        th:value="${perfil}"
                        th:text="${perfil}">
                </option>
            </select>

            <span class="erro"
                  th:if="${#fields.hasErrors('perfil')}"
                  th:errors="*{perfil}"></span>
        </div>

        <button type="submit">Salvar alterações</button>
    </form>

    <p>
        <a th:href="@{/admin/usuarios}">Cancelar</a>
    </p>
</main>
<footer th:replace="~{fragmentos/layout :: rodape}"></footer>
</body>
</html>
