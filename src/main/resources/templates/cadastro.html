<!DOCTYPE html>
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cadastro | Login Seguro</title>
    <link rel="stylesheet" th:href="@{/css/estilo.css}">
</head>
<body>
<main class="container">
    <h1>Criar conta</h1>
    <p>Preencha seus dados para se cadastrar.</p>

    <p class="sucesso"
       role="status"
       th:if="${sucesso}"
       th:text="${sucesso}">
    </p>

    <form th:action="@{/cadastro}"
          th:object="${usuario}"
          method="post">

        <div class="erro"
             role="alert"
             th:if="${#fields.hasGlobalErrors()}">
            <p th:each="erro : ${#fields.globalErrors()}"
               th:text="${erro}">
            </p>
        </div>

        <div class="campo">
            <label for="nome">Nome</label>
            <input type="text"
                   id="nome"
                   th:field="*{nome}"
                   autocomplete="name"
                   minlength="2"
                   maxlength="100"
                   required>

            <small class="erro"
                   th:if="${#fields.hasErrors('nome')}"
                   th:errors="*{nome}">
            </small>
        </div>

        <div class="campo">
            <label for="email">E-mail</label>
            <input type="email"
                   id="email"
                   th:field="*{email}"
                   autocomplete="email"
                   maxlength="254"
                   required>

            <small class="erro"
                   th:if="${#fields.hasErrors('email')}"
                   th:errors="*{email}">
            </small>
        </div>

        <div class="campo">
            <label for="senha">Senha</label>
            <input type="password"
                   id="senha"
                   name="senha"
                   autocomplete="new-password"
                   minlength="8"
                   maxlength="72"
                   required>

            <small>Use pelo menos 8 caracteres.</small>

            <small class="erro"
                   th:if="${#fields.hasErrors('senha')}"
                   th:errors="*{senha}">
            </small>
        </div>

        <button type="submit">Cadastrar</button>
    </form>
</main>
</body>
</html>
