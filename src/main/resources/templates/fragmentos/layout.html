<!DOCTYPE html>
<html lang="pt-BR"
      xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security">

<head th:fragment="head(titulo)">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title th:text="|${titulo} - ${visual.nome}|">
        Login Seguro
    </title>

    <link rel="stylesheet" th:href="@{/css/estilo.css}">

    <link rel="stylesheet"
          th:href="@{/css/temas/{tema}.css(tema=${visual.tema})}">
</head>

<body>
<header th:fragment="cabecalho" class="cabecalho">
    <a class="marca"
       th:href="@{/}">
        <img class="marca-imagem"
             th:src="@{/imagens/cristiano-ronaldo-real-madrid-1.jpg}"
             alt="Cristiano Ronaldo com a camisa do Real Madrid"
             width="367"
             height="550">
        <span th:text="${visual.nome}">Login Seguro</span>
    </a>

    <nav class="navegacao" aria-label="Navegação principal">
        <a sec:authorize="isAnonymous()"
           th:href="@{/login}">
            Entrar
        </a>

        <a sec:authorize="isAnonymous()"
           th:href="@{/cadastro}">
            Criar conta
        </a>

        <a sec:authorize="isAuthenticated()"
           th:href="@{/inicio}">
            Início
        </a>

        <a sec:authorize="hasAnyRole('MANAGER', 'ADMIN')"
           th:href="@{/gerenciamento}">
            Gerenciamento
        </a>

        <a sec:authorize="hasRole('ADMIN')"
           th:href="@{/admin}">
            Administração
        </a>

        <form sec:authorize="isAuthenticated()"
              th:action="@{/logout}"
              method="post">
            <button type="submit">Sair</button>
        </form>
    </nav>
</header>

<footer th:fragment="rodape" class="rodape">
    <p th:text="${visual.nome}">Login Seguro</p>
</footer>
</body>
</html>
